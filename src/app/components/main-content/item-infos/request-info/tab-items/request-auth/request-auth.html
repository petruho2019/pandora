<div class="auth-info-con">
  @if (isNoAuth()) {
    Без аутентификации
  } @else if (isBasic()) {
    <basic-auth
      [basicAuth]="getBasicAuth()"
      (authChanged)="handleBasicAuthChanged($event)"
    ></basic-auth>
  } @else if (isBearer()) {
    <bearer-auth
      [bearerAuth]="getBearerAuth()"
      (authChanged)="handleBearerAuthChaned($event)"
    ></bearer-auth>
  } @else if (isInherit()) {
    <inherit-auth [selectedCollectionAuth]="selectedCollectionAuth()"></inherit-auth>
  }
</div>
