<div #main class="main-content" [style.width.px]="getMainContentWidth()">
  <main-content-header></main-content-header>
  <main-content-tab-items
    [sidebarWidth]="sidebarWidth()"
    (saveReq)="handleSaveRequest($event, false, false)"
    (saveReqAlreadyInStore)="handleSaveRequest($event.tabItem, $event.needCloseTabItem, true)"
  ></main-content-tab-items>

  @if (isGeneralInfoDescriptionActiveTabItem()) {
    <description-content
      (addCollection)="handleAddCollection()"
      (openCollection)="handleOpenCollection()"
      (renameCollection)="handleRenameCollection($event)"
      (openCollectionInFS)="handleOpenInFS($event.collId)"
      (closeCollection)="handleCloseCollection($event)"
    ></description-content>
  }

  @if (isCollectionActiveTabItem()) {
    <collection-info
      [coll]="currentCollTabItem()!"
      [(collHeaders)]="collHeaders"
      [selectedAuthItem]="selectedCollectionAuthItem()[currentCollTabItem()!.id]"
      [selectedCollectionAuthItemDraft]="
        selectedCollectionAuthItemDraft()[currentCollTabItem()!.id]
      "
      [collectionAuthInfos]="collectionAuthInfos()[currentCollTabItem()!.id]"
      [collectionAuthDraftInfos]="collectionAuthDraftInfos()[currentCollTabItem()!.id]"
      [selectedTabItem]="selectedCollectionSettingTabItem()"
      (onSelectedCollectionSettingTabItemChanged)="
        handleSelectedCollectionSettingTabItemChanged($event.tabType, $event.collId)
      "
      (onSelectedAuthItemChanged)="handleSelectedCollectionAuthItemChanged($event)"
      (onSelectedAuthChanged)="handleSelectedCollectionAuthChanged($event)"
      (onSaveAuth)="handleSaveCollectionAuth($event)"
    ></collection-info>
  }

  @if (isRequestActiveTabItem()) {
    <div #reqInfo [style.height.px]="reqInfoHeight()[currentRequest()!.id]">
      <request-info
        [initialRequests]="initialRequests()"
        [req]="currentRequest()!"
        [selectedTabItem]="selectedRequestSettingTabItems()"
        [selectedAuthType]="selectedRequestAuthType()"
        [selectedBody]="selectedRequestBody()"
        [selectedCollectionAuth]="getCurrentCollAuth()"
        (onSelectedRequestSettingTabItemChanged)="
          handleSelectedRequestSettingTabItemChanged($event.tabType, $event.reqId)
        "
        (onSelectedBodyItemChanged)="handleSelectedBodyItemChanged($event.bodyItem, $event.reqId)"
        (onSelectedAuthItemChanged)="handleSelectedAuthItemChanged($event.authItem, $event.reqId)"
        (onSaveReq)="handleClickSaveRequestIcon($event)"
        (onCreateRequestTabItem)="handleAddDefaultRequestTabItem()"
      ></request-info>
    </div>

    <div #resizer cdkDrag cdkDragLockAxis="y" (cdkDragMoved)="onResize($event)" class="resizer">
      <div class="drag-line"></div>
    </div>

    <div #reqResponseInfo [style.height.px]="reqResponseHeight()[currentRequest()!.id]">
      <request-response-info [req]="currentRequest()!"></request-response-info>
    </div>
  }
</div>
